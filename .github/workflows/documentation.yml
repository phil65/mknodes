name: Build documentation

on:
    push:
        branches:
            - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

# Default to bash
defaults:
    run:
        shell: bash

env:
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
            - name: Setup Graphviz
              uses: ts-graphviz/setup-graphviz@v2
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Install dependencies
              run: |
                  uv sync --all-extras
            # Iconify's public API rate-limits shared runner IPs; reuse fetched icons
            # (mknodes' icon cache never expires) and HTTP responses (anyenv).
            - name: Cache icons and HTTP responses
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/mknodes
                      ~/.cache/anyenv
                  key: docs-http-${{ runner.os }}-${{ github.run_id }}
                  restore-keys: docs-http-${{ runner.os }}-
            - name: Build
              env:
                  MKNODES_CACHE_DIR: ~/.cache/mknodes
              run: uv run mknodes build -v
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./site

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
