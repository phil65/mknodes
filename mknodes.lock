        "value": "MkDocs wakes with a quiet CLI breath,\na craftsman of pages, a map for the mind.\nFrom Markdown threads, a house takes form,\na documentation library, arranged and kind.\n\nIn mkdocs.yml, the routes are drawn,\nnav lines charting staircases and doors.\nThemes cloak the skeleton in patient light—\nRead the Docs, Material, or colors you adore.\n\nDocs holds the chapters, gloss and guide,\nlabels and headings become rooms you explore.\nLinks thread through nav like constellations,\nthe structure a chorus you can hear once more.\n\nRun mkdocs serve, and watch it wake,\nthe dev server breathing as you save.\nA browser window glows with the growing site,\nlive reload humming like a friendly engine.\n\nBuild to site/, ship to the world outside,\na static harbor where pages load in a blink.\nHost on GitHub Pages, Netlify, or beyond,\nyour knowledge sails steady, bright as dawn.\n\nMkDocs, a quiet poem written in code,\nturning documentation into a place you can walk."
